[tool.poetry]
name = "echo_ridge_scoring"
version = "0.2.0"
description = ""
authors = ["quinnhasse <quinn.hasse@gmail.com>"]
packages = [
  { include = "echo_ridge_scoring", from = "src" }
]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.116.1"
pydantic = "^2.11.7"
pytest = "^8.4.1"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
httpx = "^0.28.1"
uvicorn = "^0.35.0"
numpy = "^2.3.2"
pandas = "^2.3.1"
typer = "^0.12.3"
sqlalchemy = "^2.0.36"
sqlmodel = "^0.0.22"
alembic = "^1.14.0"
psycopg2-binary = "^2.9.10"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
slowapi = "^0.1.9"
rich = "^13.7.1"
scipy = "^1.16.1"
scikit-learn = "^1.7.1"
structlog = "^25.4.0"
python-multipart = "^0.0.20"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
